<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Para Ti ✨</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 25%,#2b091c,#0d0308 75%);color:#fce7f3;font-family:'Cormorant Garamond',serif;padding:18px;overflow-x:hidden;transition:background 2s ease}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.top-bar{position:relative;z-index:10;margin-bottom:16px}
.btn-mus{background:rgba(60,15,40,.85);border:1px solid rgba(253,224,71,.5);color:#fef08a;padding:8px 20px;border-radius:25px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.5)}
.sheet{position:relative;z-index:5;width:100%;max-width:380px;min-height:480px;background:linear-gradient(180deg,rgba(36,10,25,.95),rgba(20,5,14,.98));border:1px solid rgba(253,224,71,.3);border-radius:22px;padding:32px 22px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,.9),inset 0 0 0 6px rgba(253,224,71,.06)}
.title-script{font-family:'Parisienne',cursive;font-size:36px;color:#fde047;margin:0;text-shadow:0 2px 12px rgba(253,224,71,.3)}
.intro-txt{font-size:19px;font-style:italic;line-height:1.6;color:#f5d0e6;margin:16px 0}
.seal-box{margin:10px 0;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer}
.seal{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e11d48,#881337 70%,#4c0519);border:2px solid #fde047;box-shadow:0 8px 25px rgba(0,0,0,.8),inset 0 0 0 4px rgba(253,224,71,.25);display:flex;align-items:center;justify-content:center;font-size:28px;color:#fef08a;animation:pulse 2.2s infinite ease-in-out;transition:transform .5s,opacity .4s}
.seal.open{transform:scale(1.6);opacity:0}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.seal-lbl{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#fde047;opacity:.85}
.letter-view{display:none;width:100%;height:100%;flex-direction:column;justify-content:space-between;align-items:center}
pre{font-family:'Courier New',monospace;font-size:7.5px;line-height:1.15;color:#fbcfe8;text-shadow:0 0 8px rgba(244,114,182,.6);margin:6px 0}
.msg-box{font-size:20px;font-style:italic;line-height:1.55;color:#fff5fb;min-height:110px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.step-ind{font-size:13px;color:#fde047;opacity:.8;font-style:italic;margin-top:8px}
.stars-end{display:none;flex-direction:column;align-items:center;width:100%;gap:10px}
.s-row{display:flex;gap:12px;justify-content:center}
.s-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(253,224,71,.5);background:rgba(255,255,255,.04);color:#fde047;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.3s}
.s-btn.on{background:#fde047;color:#2b091c;box-shadow:0 0 18px #fde047;transform:scale(1.15)}
.s-txt{font-size:17px;font-style:italic;color:#fef9c3;min-height:52px;line-height:1.4}
.btn-rst{background:transparent;border:1px solid rgba(253,224,71,.45);color:#fce7f3;padding:7px 16px;border-radius:20px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;cursor:pointer;margin-top:4px}
</style>
</head>
  <body onclick="nextStep(event)">
<canvas id="bg"></canvas>
<div class="top-bar" onclick="event.stopPropagation()">
  <button class="btn-mus" id="bmus" onclick="toggleMusic()">🎹 Encender piano romántico</button>
</div>
<div class="sheet" id="cover">
  <h1 class="title-script">Para ti</h1>
  <p class="intro-txt">Antes de que el día continúe, quise guardar aquí unas palabras pensadas solo para ti.<br><br>Enciende la música arriba y toca el sello para abrir.</p>
  <div class="seal-box">
    <div class="seal" id="seal">♥</div>
    <span class="seal-lbl">Toca el sello</span>
  </div>
</div>
<div class="sheet letter-view" id="letter">
  <pre id="art"></pre>
  <div class="msg-box" id="txt"></div>
  <div class="step-ind" id="ind"></div>
  <div class="stars-end" id="endZone" onclick="event.stopPropagation()">
    <div class="s-row" id="srow">
      <div class="s-btn" onclick="showWish(0)">✦</div>
      <div class="s-btn" onclick="showWish(1)">✦</div>
      <div class="s-btn" onclick="showWish(2)">✦</div>
      <div class="s-btn" onclick="showWish(3)">✦</div>
      <div class="s-btn" onclick="showWish(4)">✦</div>
    </div>
    <div class="s-txt" id="stxt">Toca cada estrella para descubrir un deseo ✨</div>
    <button class="btn-rst" onclick="resetCard()">↻ Volver a leer</button>
  </div>
</div>
<script>
const g=id=>document.getElementById(id),cv=g("bg"),cx=cv.getContext("2d");
let W,H,pts=[],started=false,finished=false,stepIdx=0,typing=false,tOut;
let actx=null,playing=false,mInt=null,beat=0,mGain=null,rev=null;

const song=[
  {b:[65.41,0,0,0,98.00,0,0,0],a:[130.81,196.00,246.94,261.63,329.63,261.63,246.94,196.00],m:[659.25,0,587.33,523.25,493.88,523.25,659.25,0]},
  {b:[55.00,0,0,0,82.41,0,0,0],a:[110.00,164.81,220.00,246.94,261.63,246.94,220.00,164.81],m:[587.33,0,523.25,493.88,440.00,0,392.00,440.00]},
  {b:[43.65,0,0,0,65.41,0,0,0],a:[87.31,130.81,174.61,220.00,261.63,220.00,174.61,130.81],m:[523.25,0,493.88,440.00,523.25,587.33,659.25,0]},
  {b:[49.00,0,0,0,73.42,0,0,0],a:[98.00,146.83,196.00,246.94,293.66,246.94,196.00,146.83],m:[587.33,0,523.25,493.88,440.00,392.00,329.63,392.00]}
];

function note(f,d,v,bass){
  if(!actx||!playing||!f)return;
  const t=actx.currentTime,o1=actx.createOscillator(),o2=actx.createOscillator(),gn=actx.createGain(),fl=actx.createBiquadFilter();
  o1.type="sine";o2.type="triangle";
  o1.frequency.setValueAtTime(f,t);o2.frequency.setValueAtTime(f*2,t);
  fl.type="lowpass";fl.frequency.setValueAtTime(bass?420:1800,t);fl.frequency.exponentialRampToValueAtTime(bass?110:350,t+d);
  gn.gain.setValueAtTime(0.001,t);gn.gain.linearRampToValueAtTime(v,t+0.02);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o1.connect(fl);o2.connect(fl);fl.connect(gn);gn.connect(mGain);if(!bass)gn.connect(rev);
  o1.start(t);o2.start(t);o1.stop(t+d+0.05);o2.stop(t+d+0.05);
}

function toggleMusic(){
  if(!actx){
    actx=new(window.AudioContext||window.webkitAudioContext)();
    mGain=actx.createGain();mGain.gain.value=0.85;
    rev=actx.createDelay();rev.delayTime.value=0.35;
    const fb=actx.createGain();fb.gain.value=0.3;
    rev.connect(fb);fb.connect(rev);rev.connect(mGain);mGain.connect(actx.destination);
  }
  if(actx.state==="suspended")actx.resume();
  playing=!playing;
  g("bmus").textContent=playing?"⏸ Pausar piano":"🎹 Encender piano romántico";
  clearInterval(mInt);
  if(playing){
    const run=()=>{
      const c=song[Math.floor(beat/8)%song.length],p=beat%8;
      if(c.b[p])note(c.b[p],4.5,0.28,true);
      note(c.a[p],2.4,0.07,false);
      if(c.m[p])note(c.m[p],3.0,0.11,false);
      beat++;
    };
    run();mInt=setInterval(run,480);
  }
}
  function rz(){W=cv.width=innerWidth;H=cv.height=innerHeight}onresize=rz;rz();
for(let j=0;j<45;j++)pts.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+0.8,v:Math.random()*0.35+0.1,a:Math.random()*6.28});
(function loop(){
  cx.clearRect(0,0,W,H);
  pts.forEach(p=>{
    p.a+=0.02;p.y-=p.v;if(p.y<-10){p.y=H+10;p.x=Math.random()*W}
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);
    cx.fillStyle="rgba(253,224,71,"+(0.2+Math.abs(Math.sin(p.a))*0.5)+")";cx.fill();
  });
  requestAnimationFrame(loop);
})();

const arts=[
"       .::+*%@@@@@%*+::.       \n    .:*@@%#*++===++*#%@@*:.    \n   :%@%:.  .:+*#%@%#*+:.  .:%@%:\n  *@%:  :%@%+. .:*:. .+%@%:  :%@*\n  *@%:  %@%:  :#@@@#:  :%@%  :%@*\n   :%@%++%@%#+#@@@@@#+%@@%++%@%:\n    .*@@%#@@@@@%###%@@@@@#%@@*. \n      .:+*#%@@@@@%@@@@@%#*+:.   \n          ..:--==#==--:..       \n       .:+*#%@*:.#.:*@%#*+:.    \n     .*@@%#+-..  #  ..-+%@@*.   \n                 #              ",
"  ..:+*#%@@%*+:..:+*%@@%#*+:.. \n.:%@@%#*+++*#%@@@%#*+++*#%@@%:.\n%@%:.  .:+*##*:.@.:*##*+:.  .:%@%\n*@%:  .+%@@#**#@@@@@#**#@@%+.  :%@*\n.%@%= +%@*  .:#@@@@@#:.  *@%+ =@%.\n +%@%++%@#- .%@@@@@@@%. -#@%++%@%+\n  =*@@%#@@#+=*@@@@@@@*=+#@@#%@@*= \n   .-*#%@@@@@%#*****#%@@@@@%#*-   \n     .:+*#%@@@@@%%%@@@@@%#*+:.    \n       ..-+%@@@@@@@@@@@%+-..      \n          ..-+%@@@@@%+-..         \n             ..-+@%+-..           ",
"  .:+*#%@@@%*+:.   .:+*@@@%#*+:.  \n *@@%#*+++*#%@@%: :%@@%#*+++*#%@@*\n%@%:.  .:+*##*:.@@@.:*##*+:.  .:%@%\n*@%:  .+%@@#**#%@@@%#**#@@%+.  :%@*\n.%@%= :%@#:.  .*@@@*.  .:#@%: =@%. \n +%@%++%@*  .:#@@@@@#:.  *@%++%@%+ \n  =*@@%#@@#+=*@@@@@@@*=+#@@#%@@*=  \n   .-*#%@@@@@%#**@**#%@@@@@%#*-    \n     .:+*#%@@%*-.@.-*%@@%#*+:.     \n    .*@@#*++*#%@:@:@%#*++*#@@*.    \n      .-+*#%@@%*:@:*%@@%#*+-.      \n          ..:--==#==--:..          ",
"      *        .        *      \n   .      .:+*#%@%#*+:.      . \n       .:%@@%#*===*#%@@%:.     \n      .%@@#+-..   ..-+%@@%.    \n     *@%:  .+%@@@@@%+.  :%@*   \n     *@%:  :%@@@@@@@%:  :%@*   \n     .%@%= +%@@@@@@@%+ =@%.    \n      +%@%++%@@@@@@@%++%@%+    \n       =*@@%#@@@@@@@#%@@*=     \n  ..:+*#%@@@@@%###%@@@@@%#*+:..\n.:%@@%#*+++*#%@@@@@%#*+++*#%@@%:\n.*@@#+-..      ..:..      ..-+%@@*",
" *   .   ..:+*#%@%#*+:..   .   *\n   *   .:%@@%#*+++*#%@@%:.   *  \n  *   .%@%:.  .:+*#%#*+:.  .:%@%.\n      *@%:  .+%@@#***#@@%+.  :%@*\n      .%@%= +%@*  .#.  *@%+ =@%. \n  .    +%@%++%@#- *@* -#@%++%@%+ \n        =*@@%#@@#*%@%*#@@#%@@*=  \n   *  ..:+*#%@@@@@%@@@@@%#*+:.. *\n    .:%@@%#*+++*#%@@@%#*+++*#%@@%:\n   .*@@#+-..   ..-+@+-..   ..-+%@@*\n  ~:%@%:.         .@.         .:%@%\n  ~=*#%@%#*++====+%@%+====++*#%@%#*"
];

const pages=[
  "Hay una calma muy bonita en tu voz y en tu forma de estar; contigo el ruido del mundo parece quedarse afuera.",
  "Tienes una ternura que no necesita esforzarse, una manera tan genuina de sentir que vuelve especial hasta lo más cotidiano.",
  "Admiro esa luz serena que llevas dentro, capaz de iluminar cualquier espacio sin siquiera intentarlo.",
  "A veces basta un recuerdo tuyo o una palabra sencilla para cambiarme el ánimo por completo y sacarme una sonrisa.",
  "Eres de esas personas bonitas que dejan huella en el alma y hacen que todo valga la pena. ♥"
];

const wishes=[
  "«Deseo que nunca te falten motivos para sonreír con esa luz tan bonita que tienes.» ✨",
  "«Deseo que la vida te devuelva multiplicada toda la calidez y ternura que entregas.» ♥",
  "«Deseo seguir compartiendo contigo conversaciones eternas, risas y calma.» 🌹",
  "«Deseo que cada sueño que guardas en silencio encuentre siempre el camino para cumplirse.» 🌟",
  "«Deseo poder seguir cuidando tu corazón y recordándote todos los días lo valiosa que eres.» ♥"
];

function renderPage(i){
  clearTimeout(tOut);typing=true;
  g("art").textContent=arts[i];g("txt").textContent="";g("ind").textContent="";
  let p=0,m=pages[i];
  (function type(){
    if(p<=m.length){g("txt").textContent=m.slice(0,p++);tOut=setTimeout(type,45)}
    else{typing=false;endPage(i)}
  })();
}

function endPage(i){
  if(i<pages.length-1)g("ind").textContent="Toca la hoja para continuar ("+(i+1)+"/"+pages.length+")";
  else{finished=true;g("ind").textContent="Con todo mi cariño, para ti ✨";g("endZone").style.display="flex"}
}

function nextStep(){
  if(finished)return;
  if(!started){
    started=true;if(navigator.vibrate)navigator.vibrate(50);
    g("seal").classList.add("open");
    if(!playing)toggleMusic();
    setTimeout(()=>{g("cover").style.display="none";g("letter").style.display="flex";renderPage(0)},400);
    return;
  }
  if(typing){clearTimeout(tOut);typing=false;g("txt").textContent=pages[stepIdx];endPage(stepIdx);return}
  if(stepIdx<pages.length-1){if(navigator.vibrate)navigator.vibrate(25);stepIdx++;renderPage(stepIdx)}
}

function showWish(n){
  if(navigator.vibrate)navigator.vibrate(30);
  const b=g("srow").children;
  for(let k=0;k<b.length;k++)b[k].classList.toggle("on",k===n);
  g("stxt").textContent=wishes[n];
}

function resetCard(){
  finished=false;stepIdx=0;g("endZone").style.display="none";
  const b=g("srow").children;for(let k=0;k<b.length;k++)b[k].classList.remove("on");
  g("stxt").textContent="Toca cada estrella para descubrir un deseo ✨";
  renderPage(0);
}
</script>
</body>
</html>
